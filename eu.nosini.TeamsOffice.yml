id: eu.nosini.TeamsOffice
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
# Zypak and the libraries Electron needs that the Platform lacks.
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: teams-office
# Electron keeps its translations in the app; there is nothing to split off.
separate-locales: false
finish-args:
  # Chromium's shared memory.
  - --share=ipc
  # Hardware rendering, webcams in calls and security keys for sign-in.
  # Chromium opens cameras and FIDO2 keys directly; no narrower permission
  # covers them.
  - --device=all
  # Native Wayland with an X11 fallback.
  - --socket=wayland
  - --socket=fallback-x11
  # Calls and notification sounds.
  - --socket=pulseaudio
  # Teams itself, and the Office add-in host on 127.0.0.1.
  - --share=network
  # Saving downloaded files; other files are opened through portals.
  - --filesystem=xdg-download
  # Screen sharing through PipeWire.
  - --filesystem=xdg-run/pipewire-0
  # Notifications for messages and calls, through libnotify.
  - --talk-name=org.freedesktop.Notifications
  # Tray icon, idle inhibition, session shutdown and unread badges.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.gnome.SessionManager
  - --talk-name=com.canonical.Unity
  # Electron's suspend and resume notifications.
  - --system-talk-name=org.freedesktop.login1
  # Electron only sets unread badges through the Unity launcher API when it
  # thinks it runs on Unity. The cursor path fixes cursor scaling on Wayland.
  # Both as in the upstream Teams for Linux Flatpak.
  - --env=XDG_CURRENT_DESKTOP=Unity
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - '*.a'
  - '*.la'
modules:
  # Security keys for sign-in: Teams for Linux runs fido2-assert from
  # libfido2, as in the upstream Flatpak.
  - name: libcbor
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DWITH_EXAMPLES=OFF
    sources:
      - type: git
        url: https://github.com/PJK/libcbor.git
        tag: v0.14.0
        commit: 6730c20ab487c0b4dc5fb3fea918937085355bac
        x-checker-data:
          type: git
          tag-pattern: ^v(\d+\.\d+\.\d+)$

  - name: libfido2
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TOOLS=ON
      - -DBUILD_TESTS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_MANPAGES=OFF
      - -DBUILD_STATIC_LIBS=OFF
    sources:
      - type: git
        url: https://github.com/Yubico/libfido2.git
        tag: 1.17.0
        commit: b974e7cf2ee7392134cc12c08b76a068cf250dd8
        x-checker-data:
          type: git
          tag-pattern: ^(\d+\.\d+\.\d+)$

  - name: teams-office
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin
      env:
        # npm packages and Electron come from generated-sources.json; the
        # build has no network access.
        XDG_CACHE_HOME: /run/build/teams-office/flatpak-node/cache
        npm_config_cache: /run/build/teams-office/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - bash flatpak/build-app.sh
      - install -Dm755 launcher/teams-office -t "${FLATPAK_DEST}/bin"
    sources:
      # Teams for Linux with the Office MCP bridge.
      - type: git
        url: https://github.com/nosini/teams-for-linux-mcp.git
        # New source tags pin Teams for Linux as a Git submodule.
        disable-submodules: false
        tag: office-v2.27.0-4
        commit: 58b97669fdd168397a7d0ae267a5a8a2d930b2b8
        x-checker-data:
          type: git
          # A -N suffix marks a later app build on the same upstream version.
          tag-pattern: ^office-v(\d+\.\d+\.\d+(?:-\d+)?)$
          is-main-source: true
      # npm dependencies and Electron, generated by scripts/generate-node-deps.sh.
      - generated-sources.json
      - type: file
        path: scripts/build-app.sh
        dest: flatpak
      - type: file
        path: launcher/teams-office
        dest: launcher

  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 eu.nosini.TeamsOffice.metainfo.xml -t "${FLATPAK_DEST}/share/metainfo"
      - install -Dm644 eu.nosini.TeamsOffice.desktop -t "${FLATPAK_DEST}/share/applications"
    sources:
      - type: file
        path: eu.nosini.TeamsOffice.metainfo.xml
      - type: file
        path: eu.nosini.TeamsOffice.desktop
